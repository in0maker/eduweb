<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duygu Dedektifi - inomaker</title>
    
    <!-- MediaPipe ve CameraUtils Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #EEC21A;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; touch-action: manipulation;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 800px; margin-bottom: 15px;
        }

        .score-board {
            background: #ffffff; padding: 12px 25px; border-radius: 25px;
            font-size: 1.5rem; color: #2b2b2b; box-shadow: 0 6px 0 #cccccc;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-back {
            background-color: #ff5252; color: white; border: none;
            border-radius: 20px; padding: 12px 25px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #d32f2f; transition: all 0.1s;
        }
        .btn-back:active { transform: translateY(5px); box-shadow: 0 0 0 #d32f2f; }

        .game-container {
            position: relative; width: 100%; max-width: 800px;
            aspect-ratio: 4 / 3; background: #000; border-radius: 35px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 6px solid #ffffff;
        }

        #webcam, #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: scaleX(-1); object-fit: cover;
        }

        .target-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); padding: 15px 30px; border-radius: 30px;
            font-size: 1.8rem; font-weight: bold; color: #1c66ed; text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 10;
        }

        .instruction-box {
            margin-top: 15px; background: #fffdf6; padding: 15px 30px;
            border-radius: 25px; font-size: 1.2rem; font-weight: bold;
            color: #2b2b2b; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(255, 82, 82, 0.95);
            color: white; padding: 20px; border-radius: 15px; text-align: center;
            z-index: 20; width: 80%; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .score-board { font-size: 1.1rem; padding: 8px 16px; }
            .btn-back { font-size: 1rem; padding: 8px 16px; }
            .target-box { font-size: 1.3rem; padding: 10px 20px; }
            .instruction-box { font-size: 1rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-back" onclick="location.href='../../index.html#levels'">◀ Menü</button>
        <div class="score-board">⭐ Puan: <span id="score">0</span></div>
    </div>

    <div class="game-container">
        <div id="error-msg"></div>
        <div class="target-box" id="target-display">Hedef: 😄 Mutlu Ol!</div>
        <video id="webcam" playsinline webkit-playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="instruction-box" id="status-text">
        📸 Kamera karşısına geç ve istenen yüz ifadesini yap!
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreElement = document.getElementById('score');
        const targetDisplay = document.getElementById('target-display');
        const statusText = document.getElementById('status-text');
        const errorMsg = document.getElementById('error-msg');

        let score = 0;
        const emotions = [
            { id: 'happy', name: 'Mutlu Ol!', emoji: '😄' },
            { id: 'surprised', name: 'Şaşır!', emoji: '😲' },
            { id: 'neutral', name: 'Ciddi Ol!', emoji: '😐' }
        ];
        let currentEmotion = emotions[0];
        let holdTimer = 0;

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
        }

        function pickRandomEmotion() {
            const next = emotions[Math.floor(Math.random() * emotions.length)];
            currentEmotion = next;
            targetDisplay.innerHTML = `Hedef: ${next.emoji} ${next.name}`;
            holdTimer = 0;
        }

        function onResults(results) {
            if (!results.image) return;

            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Ağız Genişliği ve Yüksekliği Hesaplama (Mouth Ratio)
                const mouthLeft = landmarks[61];
                const mouthRight = landmarks[291];
                const mouthTop = landmarks[13];
                const mouthBottom = landmarks[14];

                const mouthWidth = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
                const mouthHeight = Math.hypot(mouthTop.x - mouthBottom.x, mouthTop.y - mouthBottom.y);
                const mouthRatio = mouthHeight / mouthWidth;

                // Ağız Kenarları ve Yüz Oranı
                const lipCornerLeft = landmarks[61].y;
                const lipCornerRight = landmarks[291].y;
                const noseTip = landmarks[1].y;
                const smileScore = noseTip - ((lipCornerLeft + lipCornerRight) / 2);

                let detectedEmotion = 'neutral';

                if (mouthRatio > 0.4) {
                    detectedEmotion = 'surprised';
                } else if (smileScore > 0.02) {
                    detectedEmotion = 'happy';
                } else {
                    detectedEmotion = 'neutral';
                }

                // Eşleşme Kontrolü
                if (detectedEmotion === currentEmotion.id) {
                    holdTimer++;
                    statusText.innerHTML = `✨ Harika! Böyle kal... (${holdTimer}/15)`;
                    
                    if (holdTimer >= 15) {
                        score += 10;
                        scoreElement.innerText = score;
                        statusText.innerHTML = "🎉 Tebrikler! Harika duygu değişimi!";
                        pickRandomEmotion();
                    }
                } else {
                    holdTimer = 0;
                    statusText.innerHTML = "📸 İstenen yüz ifadesini taklit etmeye çalış!";
                }
            }
            canvasCtx.restore();
        }

        try {
            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().catch(() => {
                showError("⚠️ Kamera başlatılamadı!<br>Lütfen tarayıcınızın kamera iznini kontrol edin.");
            });
        } catch (e) {
            showError("⚠️ Kütüphaneler yüklenirken hata oluştu!<br>İnternet bağlantınızı kontrol edin.");
        }

        pickRandomEmotion();
    </script>
</body>
</html>
