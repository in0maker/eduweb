<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inomaker EduWeb - Robotik, Kodlama ve AI Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Poppins (TÜRKÇE DESTEKLİ) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            brand: {
              yellow: '#EEC21A', // Marka Altın Sarı Rengi
              yellowDark: '#D4A810',
              purple: '#8302BF',
              purpleDark: '#5B0185',
              red: '#FF5252',
              green: '#27AE60',
              blue: '#06B6D4',
              bgLight: '#FFFDF0'
            }
          },
          boxShadow: {
            'playful': '0 8px 0 0 rgba(0, 0, 0, 0.18)',
            'playful-pressed': '0 2px 0 0 rgba(0, 0, 0, 0.18)',
            'gold-glow': '0 0 20px rgba(238, 194, 26, 0.6)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #EEC21A;
      background-image: radial-gradient(rgba(255, 255, 255, 0.3) 2px, transparent 2px);
      background-size: 24px 24px;
    }
    
    /* Marka Logosu Parıltı Efekti */
    .logo-gold-card {
      background: linear-gradient(135deg, #ffffff 0%, #fffdf0 100%);
      border: 3px solid #EEC21A;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1), 0 0 15px rgba(238, 194, 26, 0.4);
    }
    
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatAnim 3s ease-in-out infinite;
    }

    /* Custom Focus State */
    *:focus-visible {
      outline: 4px solid #8302BF !important;
      outline-offset: 4px !important;
    }
  </style>
</head>

<body class="min-h-full flex flex-col font-sans antialiased text-slate-800">

  <!-- ÜST HEADER & MARKA LOGO ALANI -->
  <header class="bg-white/95 backdrop-blur-md border-b-4 border-brand-purple/20 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Marka Logosu (#EEC21A Altın Vurgulu) -->
      <div class="flex items-center space-x-3 cursor-pointer group" onclick="filterGames('all')">
        <div class="logo-gold-card p-2 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105">
          <img src="logo.png" alt="Inomaker Logo" class="h-10 sm:h-12 w-auto object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'font-fredoka text-2xl font-bold text-brand-purple\'>ino<span class=\'text-brand-yellow\'>maker</span></span>';">
        </div>
        <div class="hidden sm:block">
          <span class="font-fredoka text-xl font-bold text-brand-purple tracking-wide block">Inomaker <span class="text-amber-600">EduWeb</span></span>
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">AI & Robotik Portal</span>
        </div>
      </div>

      <!-- Aksiyon Butonları (JSON yükleme butonu kaldırıldı) -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <!-- Sesli Rehber Toggle -->
        <button id="ttsToggleBtn" onclick="toggleTTS()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-fredoka font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl text-xs sm:text-sm border-2 border-amber-300 transition-all flex items-center space-x-2 shadow-sm">
          <i id="ttsIcon" class="fa-solid fa-volume-high text-amber-600"></i>
          <span class="hidden md:inline">Sesli Rehber</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ANA İÇERİK -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- SPARKY MASCOT KARŞILAMA BANNERI -->
    <section class="bg-white/90 backdrop-blur-sm border-4 border-white rounded-3xl p-6 shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center space-x-4 sm:space-x-6 z-10">
        <!-- Sparky Avatar -->
        <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-brand-purple to-purple-500 rounded-full flex items-center justify-center text-4xl text-white shadow-lg border-4 border-amber-300 animate-float shrink-0">
          🤖
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="font-fredoka text-2xl sm:text-3xl font-bold text-slate-900">Merhaba! Ben Sparky ✨</h1>
            <button onclick="speakText('Merhaba arkadaşım! Bugün hangi eğlenceli oyunu oynamak istersin? Aşağıdan bir oyun seç ve hemen başla!')" class="text-brand-purple hover:text-purple-900 text-lg p-1">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <p class="text-slate-600 font-medium text-sm sm:text-base mt-1">
            Yapay zekâ, kodlama ve eğlenceli bulmacalar seni bekliyor. Kategorini seç ve keşfetmeye başla!
          </p>
        </div>
      </div>

      <!-- Arama Kutusu -->
      <div class="w-full md:w-72 z-10">
        <div class="relative">
          <input type="text" id="searchInput" oninput="searchGames()" placeholder="Oyun ara..." class="w-full bg-slate-100 border-2 border-slate-300 focus:border-brand-purple rounded-2xl px-4 py-3 pl-10 text-sm font-bold outline-none transition-all">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
        </div>
      </div>
    </section>

    <!-- KATEGORİ FİLTRELERİ -->
    <section class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap">
      <button onclick="filterGames('all')" class="filter-btn active bg-white border-2 border-brand-purple text-brand-purple font-fredoka font-bold px-4 py-2.5 rounded-2xl text-sm sm:text-base shadow-sm hover:bg-brand-purple hover:text-white transition-all flex items-center space-x-2">
        <span>🌟 Tümü</span>
      </button>
      <button onclick="filterGames('ai')" class="filter-btn bg-white border-2 border-brand-purple text-brand-purple font-fredoka font-bold px-4 py-2.5 rounded-2xl text-sm sm:text-base shadow-sm hover:bg-brand-purple hover:text-white transition-all flex items-center space-x-2">
        <span>🤖 Yapay Zeka</span>
      </button>
      <button onclick="filterGames('code')" class="filter-btn bg-white border-2 border-brand-purple text-brand-purple font-fredoka font-bold px-4 py-2.5 rounded-2xl text-sm sm:text-base shadow-sm hover:bg-brand-purple hover:text-white transition-all flex items-center space-x-2">
        <span>🧩 Kodlama & Robotik</span>
      </button>
      <button onclick="filterGames('art')" class="filter-btn bg-white border-2 border-brand-purple text-brand-purple font-fredoka font-bold px-4 py-2.5 rounded-2xl text-sm sm:text-base shadow-sm hover:bg-brand-purple hover:text-white transition-all flex items-center space-x-2">
        <span>🎨 Sanat & Beceri</span>
      </button>
      <button onclick="filterGames('mouse')" class="filter-btn bg-white border-2 border-brand-purple text-brand-purple font-fredoka font-bold px-4 py-2.5 rounded-2xl text-sm sm:text-base shadow-sm hover:bg-brand-purple hover:text-white transition-all flex items-center space-x-2">
        <span>🖱️ Mouse Becerisi</span>
      </button>
    </section>

    <!-- OYUN KARTLARI GRİD DÜZENİ -->
    <section>
      <div id="gamesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
        <!-- Dinamik Oyun Kartları Buraya Otomatik Yüklenecek -->
      </div>
    </section>

  </main>

  <!-- OYUN OYNATMA MODAL PENCERESİ -->
  <div id="gameModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md hidden flex-col items-center justify-center p-2 sm:p-4">
    <div id="modalContainer" class="bg-white w-full max-w-[95vw] h-[92vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border-4 border-amber-400 transition-all duration-300">
      
      <!-- Modal Header -->
      <div class="bg-brand-purple text-white px-4 sm:px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
          <span id="modalGameIcon" class="text-2xl">🎮</span>
          <h2 id="modalGameTitle" class="font-fredoka text-lg sm:text-xl font-bold">Oyun Adı</h2>
        </div>
        
        <div class="flex items-center space-x-2">
          <!-- Tam Ekran Butonu -->
          <button onclick="toggleFullscreen()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all shadow-md flex items-center space-x-1">
            <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline">Tam Ekran</span>
          </button>
          <!-- Kapat Butonu -->
          <button onclick="closeGameModal()" class="bg-brand-red hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all shadow-md">
            <i class="fa-solid fa-xmark mr-1"></i> Kapat
          </button>
        </div>
      </div>

      <!-- Game Frame Container -->
      <div class="flex-grow bg-slate-100 relative w-full h-full overflow-hidden flex items-center justify-center">
        <iframe id="gameIframe" src="" class="w-full h-full border-none" allow="camera; microphone; autoplay"></iframe>
      </div>
    </div>
  </div>

  <script>
    let currentGamesList = [];
    let activeCategory = 'all';
    let ttsEnabled = true;

    // Türkçe Sesli Rehber (TTS)
    function speakText(text) {
      if (!ttsEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = 0.95;
      utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const icon = document.getElementById('ttsIcon');
      if (ttsEnabled) {
        icon.className = 'fa-solid fa-volume-high text-amber-600';
        speakText('Sesli rehber aktif.');
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
        window.speechSynthesis.cancel();
      }
    }

    // game.json Dosyasını Otomatik Çekme
    async function loadGamesData() {
      try {
        const response = await fetch('game.json');
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            currentGamesList = data;
          }
        } else {
          console.error('game.json dosyası yüklenemedi.');
        }
      } catch (err) {
        console.error('JSON dosyası okunurken hata oluştu:', err);
      }
      renderGames();
    }

    // Oyun Kartlarını Ekrana Basma
    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = currentGamesList.filter(game => {
        const matchesCategory = (activeCategory === 'all') || (game.category === activeCategory);
        const matchesSearch = game.title.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white/80 rounded-3xl p-8 text-center border-2 border-dashed border-slate-300">
            <span class="text-4xl block mb-2">🔍</span>
            <p class="font-fredoka text-lg font-bold text-slate-700">Aradığınız kriterlere uygun oyun bulunamadı.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = `bg-white rounded-3xl p-4 flex flex-col items-center justify-between text-center cursor-pointer border-4 transition-all duration-200 transform hover:-translate-y-2 hover:shadow-2xl shadow-playful active:translate-y-1 relative group min-h-[190px] ${
          game.featured ? 'border-brand-red bg-amber-50/50' : 'border-white'
        }`;

        card.onclick = () => launchGame(game);
        card.onmouseenter = () => speakText(game.title);

        card.innerHTML = `
          ${game.featured ? '<span class="absolute -top-3 bg-brand-red text-white font-fredoka text-[10px] uppercase font-bold px-3 py-0.5 rounded-full shadow">Öne Çıkan</span>' : ''}
          <div class="text-5xl my-2 transform group-hover:scale-110 transition-transform">
            ${game.icon}
          </div>
          <h3 class="font-fredoka text-base sm:text-lg font-bold text-slate-800 leading-tight">
            ${game.title}
          </h3>
          <button class="mt-3 w-full bg-brand-purple hover:bg-purple-800 text-white font-fredoka font-bold text-xs py-2 px-3 rounded-xl shadow transition-all">
            Oyna <i class="fa-solid fa-play ml-1"></i>
          </button>
        `;

        grid.appendChild(card);
      });
    }

    // Kategorilere Göre Filtreleme
    function filterGames(category) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-brand-purple', 'text-white');
      });

      event?.currentTarget?.classList.add('active');
      renderGames();
    }

    function searchGames() {
      renderGames();
    }

    // Oyun Başlatma Yöneticisi
    function launchGame(game) {
      speakText(`${game.title} açılıyor.`);

      if (game.isInternalRoute) {
        alert(`${game.title} dahili alanına yönlendiriliyorsunuz.`);
      } else {
        const modal = document.getElementById('gameModal');
        const iframe = document.getElementById('gameIframe');
        document.getElementById('modalGameTitle').innerText = game.title;
        document.getElementById('modalGameIcon').innerText = game.icon;
        
        iframe.src = game.path;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }

    function closeGameModal() {
      const modal = document.getElementById('gameModal');
      const iframe = document.getElementById('gameIframe');
      iframe.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Sayfa Yüklendiğinde game.json Dosyasını Otomatik Çek
    window.onload = () => {
      loadGamesData();
    };

    function toggleFullscreen() {
      const modalContainer = document.getElementById('modalContainer');
      const icon = document.getElementById('fullscreenIcon');

      if (!document.fullscreenElement) {
        if (modalContainer.requestFullscreen) {
          modalContainer.requestFullscreen();
        } else if (modalContainer.webkitRequestFullscreen) { /* Safari */
          modalContainer.webkitRequestFullscreen();
        }
        icon.className = 'fa-solid fa-compress';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        icon.className = 'fa-solid fa-expand';
      }
    }
  </script>
</body>
</html>
