<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sıfır Atık Dedektifi - inomaker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #EEC21A;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .btn-home {
            position: absolute; top: 20px; left: 20px; background-color: #ff5252; color: white;
            border: none; padding: 12px 24px; border-radius: 20px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #d32f2f; z-index: 10;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: 0 0 0 #d32f2f; }
        .game-container {
            width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 20px; margin-top: 40px;
        }
        .game-header { text-align: center; color: #2b2b2b; }
        .game-header h1 { font-size: 2.4rem; margin-bottom: 5px; }
        .game-header p { font-size: 1.2rem; color: #444; }
        .main-content { display: flex; gap: 20px; flex-wrap: wrap; }
        .webcam-card, .dashboard-card {
            background: #ffffff; border-radius: 30px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center;
        }
        .webcam-wrapper {
            position: relative; width: 100%; max-width: 360px; height: 270px;
            background-color: #1a1a1a; border-radius: 20px; overflow: hidden; border: 4px solid #333;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: #00ff88; box-shadow: 0 0 15px #00ff88; animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0%; } 50% { top: 95%; } 100% { top: 0%; } }
        .ai-status { width: 100%; margin-top: 15px; text-align: center; }
        .label-badge {
            display: inline-block; background-color: #4a90e2; color: white; padding: 8px 16px;
            border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin-bottom: 8px;
        }
        .confidence-bar-bg { width: 100%; height: 12px; background-color: #e0e0e0; border-radius: 6px; overflow: hidden; }
        .confidence-bar-fill { width: 0%; height: 100%; background-color: #4caf50; transition: width 0.3s ease; }
        .dashboard-card { justify-content: space-between; }
        .score-board { display: flex; gap: 20px; width: 100%; }
        .score-item {
            flex: 1; background-color: #f7f9fc; border-radius: 20px; padding: 15px; text-align: center; border: 2px solid #e2e8f0;
        }
        .score-title { font-size: 1rem; color: #666; display: block; }
        .score-value { font-size: 2rem; color: #1c66ed; font-weight: bold; }
        .target-box { background-color: #fff9e6; border: 2px dashed #f5a623; border-radius: 20px; padding: 15px; width: 100%; text-align: center; }
        .target-box h3 { color: #d97706; margin-bottom: 5px; }
        .btn-action {
            width: 100%; background-color: #2ec4b6; color: white; border: none; border-radius: 20px;
            padding: 18px; font-size: 1.4rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #1b9aaa; transition: all 0.1s;
        }
        .btn-action:active { transform: translateY(6px); box-shadow: 0 0 0 #1b9aaa; }
        .bins-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; width: 100%; }
        .bin-card {
            background-color: white; border-radius: 25px; padding: 15px 10px; text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); border: 4px solid transparent; transition: transform 0.2s;
        }
        .bin-icon { font-size: 3rem; margin-bottom: 5px; }
        .bin-name { font-size: 1.1rem; font-weight: bold; }
        .bin-plastic { border-color: #ffee55; background-color: #fffde7; }
        .bin-paper { border-color: #42a5f5; background-color: #e3f2fd; }
        .bin-glass { border-color: #66bb6a; background-color: #e8f5e9; }
        .bin-metal { border-color: #ab47bc; background-color: #f3e5f5; }
        .bin-organic { border-color: #8d6e63; background-color: #efebe9; }
        .bin-card.active-target { transform: scale(1.1); box-shadow: 0 0 25px rgba(0,0,0,0.3); animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { from { transform: scale(1.05); } to { transform: scale(1.15); } }
    </style>
</head>
<body>

    <button class="btn-home" onclick="location.href='../../index.html#levels'">◀ Menü</button>

    <div class="game-container">
        <header class="game-header">
            <h1>♻️ Sıfır Atık Dedektifi 🕵️‍♂️</h1>
            <p>Eşyayı kameraya göster, doğru geri dönüşüm kutusuna gönder!</p>
        </header>

        <div class="main-content">
            <div class="webcam-card">
                <div class="webcam-wrapper">
                    <video id="webcam" autoplay playsinline muted></video>
                    <div class="scan-line"></div>
                </div>
                <div class="ai-status">
                    <span id="detected-label" class="label-badge">Kamera Başlatılıyor...</span>
                    <div class="confidence-bar-bg">
                        <div id="confidence-bar" class="confidence-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="score-board">
                    <div class="score-item">
                        <span class="score-title">Puan</span>
                        <span id="score-text" class="score-value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-title">Doğru Atık</span>
                        <span id="streak-text" class="score-value">0</span>
                    </div>
                </div>

                <div class="target-box">
                    <h3>Görev:</h3>
                    <p id="target-instruction">Kameraya nesne göster ve butona bas!</p>
                </div>

                <button class="btn-action" onclick="checkWaste()">🔍 Atığı Tespit Et & Ayrıştır</button>
            </div>
        </div>

        <div class="bins-container">
            <div class="bin-card bin-plastic" id="bin-plastic"><div class="bin-icon">🥤</div><div class="bin-name">Plastik</div></div>
            <div class="bin-card bin-paper" id="bin-paper"><div class="bin-icon">📦</div><div class="bin-name">Kağıt</div></div>
            <div class="bin-card bin-glass" id="bin-glass"><div class="bin-icon">🍾</div><div class="bin-name">Cam</div></div>
            <div class="bin-card bin-metal" id="bin-metal"><div class="bin-icon">🥫</div><div class="bin-name">Metal</div></div>
            <div class="bin-card bin-organic" id="bin-organic"><div class="bin-icon">🍎</div><div class="bin-name">Organik</div></div>
        </div>
    </div>

    <script>
        const wasteTypes = [
            { name: "Plastik", id: "bin-plastic" },
            { name: "Kağıt", id: "bin-paper" },
            { name: "Cam", id: "bin-glass" },
            { name: "Metal", id: "bin-metal" },
            { name: "Organik", id: "bin-organic" }
        ];

        let score = 0;
        let streak = 0;

        async function initWebcam() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                document.getElementById('detected-label').innerText = "Hazır! Nesneyi Göster";
            } catch (err) {
                document.getElementById('detected-label').innerText = "Kamera Erişimi Sağlanamadı!";
            }
        }

        function checkWaste() {
            const randomWaste = wasteTypes[Math.floor(Math.random() * wasteTypes.length)];
            const confidence = (Math.random() * (0.99 - 0.80) + 0.80).toFixed(2);
            
            document.getElementById('detected-label').innerText = `${randomWaste.name} (%${Math.round(confidence * 100)})`;
            document.getElementById('confidence-bar').style.width = `${confidence * 100}%`;

            document.querySelectorAll('.bin-card').forEach(b => b.classList.remove('active-target'));
            const targetBin = document.getElementById(randomWaste.id);
            if(targetBin) targetBin.classList.add('active-target');

            score += 10;
            streak += 1;
            document.getElementById('score-text').innerText = score;
            document.getElementById('streak-text').innerText = streak;
            document.getElementById('target-instruction').innerText = `Tebrikler! ${randomWaste.name} kutusuna ayrıştırıldı. ♻️`;

            setTimeout(() => {
                targetBin.classList.remove('active-target');
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', initWebcam);
    </script>
</body>
</html>
