<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yapay Zeka ile Taş-Kağıt-Makas - inomaker</title>
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #EEC21A;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; touch-action: manipulation;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 900px; margin-bottom: 15px;
        }

        .btn-back {
            background-color: #ff5252; color: white; border: none;
            border-radius: 20px; padding: 12px 25px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #d32f2f; transition: all 0.1s;
        }
        .btn-back:active { transform: translateY(5px); box-shadow: 0 0 0 #d32f2f; }

        .scoreboard {
            background: #ffffff; padding: 10px 25px; border-radius: 25px;
            font-size: 1.5rem; font-weight: bold; color: #2b2b2b;
            box-shadow: 0 5px 0 #cccccc; display: flex; gap: 15px; align-items: center;
        }
        .score-user { color: #2196f3; }
        .score-ai { color: #ff5252; }
        .target-score { font-size: 0.9rem; color: #666; background: #eee; padding: 3px 8px; border-radius: 10px; }

        .game-arena {
            display: flex; gap: 20px; width: 100%; max-width: 900px;
            margin-bottom: 20px;
        }

        .player-card, .ai-card {
            flex: 1; background: #ffffff; border-radius: 35px;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 6px solid #fff;
            position: relative; overflow: hidden;
        }

        .player-card { border-color: #2196f3; }
        .ai-card { border-color: #ff5252; background: #fffdf6; }

        .card-title { font-size: 1.5rem; color: #333; margin-bottom: 15px; font-weight: bold; }
        
        .cam-container {
            width: 100%; aspect-ratio: 4/3; background: #000;
            border-radius: 20px; overflow: hidden; position: relative;
        }

        #webcam, #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: scaleX(-1); object-fit: cover;
        }

        .ai-gesture-display {
            width: 100%; aspect-ratio: 4/3; display: flex;
            align-items: center; justify-content: center; font-size: 8rem;
            background: #f0f0f0; border-radius: 20px; color: #333;
        }

        .detected-gesture {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(255,255,255,0.9); padding: 10px; border-radius: 15px;
            font-size: 2.5rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .controls {
            width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center;
            background: #ffffff; padding: 20px; border-radius: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-play {
            background-color: #4caf50; color: white; border: none; border-radius: 30px;
            padding: 15px 50px; font-size: 1.8rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 0 #2e7d32; transition: all 0.1s; margin-bottom: 10px;
        }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0 0 #2e7d32; }
        .btn-play:disabled { background-color: #9e9e9e; box-shadow: 0 8px 0 #616161; cursor: not-allowed; }

        .btn-reset {
            background-color: #ff9800; color: white; border: none; border-radius: 25px;
            padding: 10px 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0 #e65100; transition: all 0.1s; margin-top: 10px; display: none;
        }
        .btn-reset:active { transform: translateY(5px); box-shadow: 0 0 0 #e65100; }

        .result-text { font-size: 1.5rem; font-weight: bold; color: #333; text-align: center; }

        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 82, 82, 0.95); color: white; padding: 20px; border-radius: 15px;
            z-index: 50; width: 80%; font-size: 1.1rem; text-align: center;
        }

        @media (max-width: 768px) {
            .game-arena { flex-direction: column; }
            .btn-back { font-size: 1rem; padding: 8px 16px; }
            .scoreboard { font-size: 1.2rem; padding: 8px 15px; }
            .ai-gesture-display { font-size: 5rem; }
            .detected-gesture { font-size: 1.8rem; }
            .btn-play { font-size: 1.4rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-back" onclick="location.href='../../index.html#levels'">◀ Menü</button>
        <div class="scoreboard">
            <span class="score-user">Sen: <span id="userScore">0</span></span>
            <span>-</span>
            <span class="score-ai">Yapay Zeka: <span id="aiScore">0</span></span>
            <span class="target-score">Hedef: 5</span>
        </div>
    </div>

    <div id="error-msg"></div>

    <div class="game-arena">
        <!-- Oyuncu Tarafı -->
        <div class="player-card">
            <div class="card-title">Senin Hamlen</div>
            <div class="cam-container">
                <video id="webcam" playsinline webkit-playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div class="detected-gesture" id="userGestureIcon">❓</div>
            </div>
        </div>

        <!-- Yapay Zeka Tarafı -->
        <div class="ai-card">
            <div class="card-title">Yapay Zeka</div>
            <div class="ai-gesture-display" id="aiGestureIcon">🤖</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-play" id="playBtn" onclick="playRound()" disabled>Kamerayı Bekliyor...</button>
        <div class="result-text" id="resultText">Elinizi kameraya gösterin! (5 olan kazanır)</div>
        <button class="btn-reset" id="resetBtn" onclick="resetGame()">🔄 Yeniden Başlat</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const userGestureIcon = document.getElementById('userGestureIcon');
        const aiGestureIcon = document.getElementById('aiGestureIcon');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultText = document.getElementById('resultText');
        const errorMsg = document.getElementById('error-msg');
        
        let userScore = 0;
        let aiScore = 0;
        let currentUserGesture = null; 
        let isGameOver = false;
        const maxScore = 5;
        
        const gestureMap = {
            'Rock': { icon: '✊', tr: 'Taş' },
            'Paper': { icon: '✋', tr: 'Kağıt' },
            'Scissors': { icon: '✌️', tr: 'Makas' }
        };

        const aiChoices = ['Rock', 'Paper', 'Scissors'];

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function getGesture(landmarks) {
            const wrist = landmarks[0];

            const isIndexOpen = getDistance(landmarks[8], wrist) > getDistance(landmarks[6], wrist);
            const isMiddleOpen = getDistance(landmarks[12], wrist) > getDistance(landmarks[10], wrist);
            const isRingOpen = getDistance(landmarks[16], wrist) > getDistance(landmarks[14], wrist);
            const isPinkyOpen = getDistance(landmarks[20], wrist) > getDistance(landmarks[18], wrist);

            const openFingersCount = [isIndexOpen, isMiddleOpen, isRingOpen, isPinkyOpen].filter(Boolean).length;

            if (openFingersCount === 0) {
                return 'Rock';
            } else if (openFingersCount >= 3) {
                return 'Paper';
            } else if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 'Scissors';
            }

            return null;
        }

        function playRound() {
            if (isGameOver) return;

            if (!currentUserGesture) {
                resultText.innerHTML = "Lütfen elini ekranda net göster!";
                return;
            }

            playBtn.disabled = true;
            resultText.style.color = "#333";
            resultText.innerHTML = "Yapay Zeka Seçiyor...";

            let count = 0;
            const shuffleInterval = setInterval(() => {
                aiGestureIcon.innerHTML = gestureMap[aiChoices[count % 3]].icon;
                count++;
            }, 100);

            setTimeout(() => {
                clearInterval(shuffleInterval);
                const aiMove = aiChoices[Math.floor(Math.random() * aiChoices.length)];
                aiGestureIcon.innerHTML = gestureMap[aiMove].icon;

                determineWinner(currentUserGesture, aiMove);

                if (!isGameOver) {
                    setTimeout(() => { playBtn.disabled = false; }, 1200);
                }
            }, 800);
        }

        function determineWinner(user, ai) {
            let result = "";
            let color = "#333";

            if (user === ai) {
                result = "Berabere! 🤝";
            } else if (
                (user === 'Rock' && ai === 'Scissors') ||
                (user === 'Paper' && ai === 'Rock') ||
                (user === 'Scissors' && ai === 'Paper')
            ) {
                result = "Sayı senin! 🎉";
                color = "#4caf50";
                userScore++;
            } else {
                result = "Sayı Yapay Zekanın! 🤖";
                color = "#ff5252";
                aiScore++;
            }

            document.getElementById('userScore').innerText = userScore;
            document.getElementById('aiScore').innerText = aiScore;
            
            // Oyun Bitiş Kontrolü (5 Olan Kazanır)
            if (userScore >= maxScore) {
                isGameOver = true;
                resultText.innerHTML = `<span style="color:#4caf50; font-size:2rem;">🏆 TEBRİKLER! OYUNU KAZANDIN! 🏆</span>`;
                playBtn.style.display = 'none';
                resetBtn.style.display = 'block';
            } else if (aiScore >= maxScore) {
                isGameOver = true;
                resultText.innerHTML = `<span style="color:#ff5252; font-size:2rem;">🤖 OYUNU YAPAY ZEKA KAZANDI! 🤖</span><br>Tekrar Dene!`;
                playBtn.style.display = 'none';
                resetBtn.style.display = 'block';
            } else {
                resultText.innerHTML = `<span style="color:${color};">${result}</span><br>Sen: ${gestureMap[user].tr} | AI: ${gestureMap[ai].tr}`;
            }
        }

        function resetGame() {
            userScore = 0;
            aiScore = 0;
            isGameOver = false;
            document.getElementById('userScore').innerText = '0';
            document.getElementById('aiScore').innerText = '0';
            aiGestureIcon.innerHTML = '🤖';
            userGestureIcon.innerHTML = '❓';
            resultText.innerText = "Yeni Oyun Başladı! Elini kameraya göster.";
            playBtn.style.display = 'block';
            resetBtn.style.display = 'none';
            playBtn.disabled = false;
            playBtn.innerText = "Hamle Yap! ⚔️";
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                for (let i = 0; i < landmarks.length; i++) {
                    const x = landmarks[i].x * canvasElement.width;
                    const y = landmarks[i].y * canvasElement.height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = '#ff9800';
                    canvasCtx.fill();
                }

                const gesture = getGesture(landmarks);
                if (gesture) {
                    currentUserGesture = gesture;
                    userGestureIcon.innerHTML = gestureMap[gesture].icon;
                    
                    if (!isGameOver && playBtn.disabled && playBtn.innerText.includes('Bekliyor')) {
                        playBtn.disabled = false;
                        playBtn.innerText = "Hamle Yap! ⚔️";
                        resultText.innerText = "Hazırsan butona bas!";
                    }
                } else {
                    currentUserGesture = null;
                    userGestureIcon.innerHTML = '❓';
                }
            } else {
                currentUserGesture = null;
                userGestureIcon.innerHTML = '❌';
            }
            canvasCtx.restore();
        }

        try {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().catch(() => {
                showError("⚠️ Kamera başlatılamadı!<br>Lütfen tarayıcı izinlerini kontrol edin.");
            });
        } catch (e) {
            showError("⚠️ Yapay zeka modülü yüklenemedi!");
        }
    </script>
</body>
</html>
