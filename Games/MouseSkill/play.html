<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tıklama Avcısı 🎯</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a2e; font-family: 'Arial Rounded MT Bold', sans-serif; text-align: center; color: white; overflow: hidden; user-select: none; }
        #game-board { width: 100vw; height: 80vh; position: relative; cursor: crosshair; }
        .target { position: absolute; background: #ff4757; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 15px #ff4757; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; animation: popIn 0.2s ease; }
        .target:active { transform: scale(0.8); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        
        /* Zor Seviye Titreme Efekti */
        .moving-target { animation: popIn 0.2s ease, shake 0.5s infinite alternate; }
        @keyframes shake { from { transform: translate(0, 0); } to { transform: translate(5px, 5px); } }

        #hud { height: 20vh; background: #16213e; display: flex; justify-content: space-around; align-items: center; font-size: 1.5rem; border-top: 4px solid #0f3460; }
        .btn { background: #e94560; color: white; border: none; padding: 12px 25px; font-size: 1.2rem; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-board"></div>
    <div id="hud">
        <div>Seviye: <span id="level-display" style="color: #f1c40f;">1</span></div>
        <div>Puan: <span id="score">0</span> / <span id="target-score">10</span></div>
        <div>Süre: <span id="timer">30</span>s</div>
        <button class="btn" onclick="location.href='../../index.html#mouse-games'">Menüye Dön</button>
    </div>

    <script>
        // --- SEVİYE YAPILANDIRMASI ---
        const levels = [
            { level: 1, targetSize: 80, fontSize: 35, requiredScore: 10, timeLimit: 30, shake: false },
            { level: 2, targetSize: 55, fontSize: 25, requiredScore: 12, timeLimit: 25, shake: false },
            { level: 3, targetSize: 35, fontSize: 18, requiredScore: 15, timeLimit: 20, shake: false },
            { level: 4, targetSize: 25, fontSize: 12, requiredScore: 20, timeLimit: 15, shake: true }
        ];

        let currentLevelIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        const board = document.getElementById('game-board');

        function loadLevel() {
            const currentLevel = levels[currentLevelIndex];
            score = 0;
            timeLeft = currentLevel.timeLimit;
            
            // Arayüzü Güncelle
            document.getElementById('level-display').innerText = currentLevel.level;
            document.getElementById('score').innerText = score;
            document.getElementById('target-score').innerText = currentLevel.requiredScore;
            document.getElementById('timer').innerText = timeLeft;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) endGame(false);
            }, 1000);

            createTarget();
        }

        function createTarget() {
            board.innerHTML = '';
            const currentLevel = levels[currentLevelIndex];

            // Seviye Tamamlandı mı?
            if (score >= currentLevel.requiredScore) {
                clearInterval(timerInterval);
                if (currentLevelIndex + 1 < levels.length) {
                    currentLevelIndex++;
                    board.innerHTML = `<h1 style="margin-top:15vh;">🎉 Tebrikler! Seviye ${currentLevel.level} Tamamlandı!</h1><button class="btn" onclick="loadLevel()">Seviye ${levels[currentLevelIndex].level}'e Geç</button>`;
                } else {
                    board.innerHTML = `<h1 style="margin-top:15vh;">🏆 MÜKEMMEL! Tüm Seviyeleri Bitirdin!</h1><button class="btn" onclick="restartGame()">En Baştan Başla</button>`;
                }
                return;
            }

            // Yeni Hedef Oluştur
            const target = document.createElement('div');
            target.className = 'target' + (currentLevel.shake ? ' moving-target' : '');
            target.innerText = '🎯';
            
            // Boyut ve Yazı Tipi Seviyeye Göre Dinamik Değişir
            target.style.width = `${currentLevel.targetSize}px`;
            target.style.height = `${currentLevel.targetSize}px`;
            target.style.fontSize = `${currentLevel.fontSize}px`;

            const maxX = window.innerWidth - currentLevel.targetSize - 20;
            const maxY = (window.innerHeight * 0.8) - currentLevel.targetSize - 20;
            
            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);
            
            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            
            target.onclick = () => {
                score++;
                document.getElementById('score').innerText = score;
                createTarget();
            };
            
            board.appendChild(target);
        }

        function endGame(win) {
            clearInterval(timerInterval);
            board.innerHTML = `<h1 style="margin-top:15vh;">⏰ Süre Bitti! Seviye ${levels[currentLevelIndex].level} Başarısız Oldu.</h1><button class="btn" onclick="loadLevel()">Tekrar Dene</button>`;
        }

        function restartGame() {
            currentLevelIndex = 0;
            loadLevel();
        }

        // Oyunu Başlat
        loadLevel();
    </script>
</body>
</html>
