<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sürükleyerek Boyama 🎨</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; text-align: center; user-select: none; }
        #canvas { background: white; border-radius: 10px; cursor: crosshair; margin-top: 10px; }
        .palette { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body>
    <h2>Fareyi Basılı Tutup Sürükleyerek Çizim Yap! 🎨</h2>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="palette">
        <div class="color-btn" style="background: red;" onclick="color='red'"></div>
        <div class="color-btn" style="background: blue;" onclick="color='blue'"></div>
        <div class="color-btn" style="background: green;" onclick="color='green'"></div>
        <div class="color-btn" style="background: orange;" onclick="color='orange'"></div>
        <button onclick="ctx.clearRect(0,0,600,400)">Temizle</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let color = 'red';

        canvas.onmousedown = () => painting = true;
        canvas.onmouseup = () => { painting = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.strokeStyle = color;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        };
    </script>
</body>
</html>
