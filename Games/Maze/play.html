<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Labirent Takibi 🌀</title>
    <style>
        body { margin: 0; background: #2c3e50; font-family: sans-serif; text-align: center; color: white; user-select: none; }
        #maze { position: relative; width: 500px; height: 300px; background: #34495e; margin: 30px auto; border: 4px solid #ecf0f1; }
        .wall { position: absolute; background: #e74c3c; }
        #start { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; background: #2ecc71; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #finish { position: absolute; bottom: 10px; right: 10px; width: 40px; height: 40px; background: #f1c40f; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <h2>Kırmızı Duvarlara Çarpmadan Bitişe Ulaş! 🎯</h2>
    <p>Başlamak için YEŞİL kutunun üzerine gel!</p>
    <div id="maze">
        <div id="start">BAŞLA</div>
        <div class="wall" style="top:60px; left:0; width:400px; height:20px;"></div>
        <div class="wall" style="top:140px; left:100px; width:400px; height:20px;"></div>
        <div class="wall" style="top:220px; left:0; width:400px; height:20px;"></div>
        <div id="finish">BİTİŞ</div>
    </div>
<button onclick="location.href='../../index.html#levels'">Menü</button>
    <script>
        let playing = false;
        document.getElementById('start').onmouseenter = () => { playing = true; };
        document.querySelectorAll('.wall').forEach(w => {
            w.onmouseenter = () => {
                if (playing) { alert('Duvara çarptın! Tekrar dene. 💥'); playing = false; }
            };
        });
        document.getElementById('finish').onmouseenter = () => {
            if (playing) { alert('Tebrikler! Mükemmel imleç kontrolü! 🏆'); playing = false; }
        };
    </script>
</body>
</html>
