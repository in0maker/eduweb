<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Otonom Araç - inomaker</title>
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #EEC21A;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; touch-action: manipulation;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 800px; margin-bottom: 15px;
        }

        .score-box {
            background: #ffffff; padding: 8px 20px; border-radius: 20px;
            font-size: 1.3rem; font-weight: bold; color: #2b2b2b;
            box-shadow: 0 5px 0 #cccccc;
        }

        .btn-back {
            background-color: #ff5252; color: white; border: none;
            border-radius: 20px; padding: 12px 25px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #d32f2f; transition: all 0.1s;
        }
        .btn-back:active { transform: translateY(5px); box-shadow: 0 0 0 #d32f2f; }

        .game-container {
            position: relative; width: 100%; max-width: 800px;
            aspect-ratio: 4 / 3; background: #333; border-radius: 35px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 6px solid #ffffff;
        }

        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        #webcam {
            position: absolute; top: 15px; right: 15px; width: 160px; height: 120px;
            transform: scaleX(-1); border-radius: 15px; border: 3px solid #fff;
            z-index: 10; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .instruction-box {
            margin-top: 15px; background: #fffdf6; padding: 15px 30px;
            border-radius: 25px; font-size: 1.2rem; font-weight: bold;
            color: #2b2b2b; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(255, 82, 82, 0.95);
            color: white; padding: 20px; border-radius: 15px; text-align: center;
            z-index: 20; width: 80%; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            #webcam { width: 100px; height: 75px; top: 10px; right: 10px; }
            .btn-back { font-size: 1rem; padding: 8px 16px; }
            .score-box { font-size: 1rem; padding: 6px 14px; }
            .instruction-box { font-size: 1rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-back" onclick="location.href='../../index.html#levels'">◀ Menü</button>
        <div class="score-box" id="scoreDisplay">Puan: 0</div>
    </div>

    <div class="game-container">
        <div id="error-msg"></div>
        <canvas id="gameCanvas"></canvas>
        <video id="webcam" playsinline webkit-playsinline></video>
    </div>

    <div class="instruction-box" id="status-text">
        ✋ Elini sağa/sola hareket ettirerek otonom aracı sür ve engellerden kaç!
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const errorMsg = document.getElementById('error-msg');

        let score = 0;
        let carX = 0;
        let targetCarX = 0;
        let roadOffset = 0;
        let obstacles = [];
        let gameOver = false;

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (carX === 0) carX = canvas.width / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnObstacle() {
            if (gameOver) return;
            const laneWidth = canvas.width / 3;
            const lane = Math.floor(Math.random() * 3);
            obstacles.push({
                x: lane * laneWidth + laneWidth / 2,
                y: -60,
                width: 50,
                height: 50,
                speed: 5 + Math.floor(score / 50)
            });
        }

        setInterval(spawnObstacle, 1500);

        function updateGame() {
            if (gameOver) return;

            // Aracı yumuşakça hedefe kaydır
            carX += (targetCarX - carX) * 0.15;

            // Sınırlar
            if (carX < 40) carX = 40;
            if (carX > canvas.width - 40) carX = canvas.width - 40;

            // Yol çizgi animasyonu
            roadOffset = (roadOffset + 8) % 40;

            // Çizim
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Şerit Çizgileri
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 3, 0);
            ctx.lineTo(canvas.width / 3, canvas.height);
            ctx.moveTo((canvas.width / 3) * 2, 0);
            ctx.lineTo((canvas.width / 3) * 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Çizgiyi sıfırla

            // Otonom Araç (Oyuncu)
            const carY = canvas.height - 90;
            ctx.fillStyle = '#00e676';
            ctx.shadowColor = '#00e676';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect(carX - 25, carY, 50, 80, 10);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Araç Camı & Farları
            ctx.fillStyle = '#111';
            ctx.fillRect(carX - 18, carY + 15, 36, 20);
            ctx.fillStyle = '#ffee55';
            ctx.fillRect(carX - 20, carY + 5, 10, 5);
            ctx.fillRect(carX + 10, carY + 5, 10, 5);

            // Engeller
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // Engel Çizimi (Kırmızı araçlar)
                ctx.fillStyle = '#ff5252';
                ctx.shadowColor = '#ff5252';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(obs.x - 25, obs.y, 50, 70, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Çarpışma Testi
                if (Math.abs(carX - obs.x) < 40 && Math.abs(carY - obs.y) < 60) {
                    gameOver = true;
                    showError(`💥 ÇARPIŞMA!<br>Skorun: ${score}<br><br><button onclick="resetGame()" style="padding:10px 20px; font-size:1rem; border:none; border-radius:10px; background:#fff; color:#ff5252; font-weight:bold; cursor:pointer;">Tekrar Oyna 🔄</button>`);
                }

                // Ekrandan çıkan engelleri sil ve puan ekle
                if (obs.y > canvas.height + 60) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreDisplay.innerText = `Puan: ${score}`;
                }
            }

            requestAnimationFrame(updateGame);
        }

        function resetGame() {
            score = 0;
            scoreDisplay.innerText = `Puan: 0`;
            obstacles = [];
            gameOver = false;
            errorMsg.style.display = 'none';
            updateGame();
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const wrist = hand[0]; // Bilek pozisyonu
                
                // Aynalama nedeniyle (1 - x) kullanıyoruz
                const normalX = 1 - wrist.x;
                targetCarX = normalX * canvas.width;
            }
        }

        try {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                updateGame();
            }).catch(() => {
                showError("⚠️ Kamera başlatılamadı!<br>Lütfen tarayıcı izinlerini kontrol edin.");
            });
        } catch (e) {
            showError("⚠️ Yapay zeka kütüphanesi yüklenemedi!");
        }
    </script>
</body>
</html>
