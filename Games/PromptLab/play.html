<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Lab - inomaker</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background-color: #EEC21A;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .container {
            background: #ffffff; border-radius: 30px; padding: 25px;
            max-width: 680px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center; margin-top: 10px;
        }
        h1 { color: #1c66ed; margin-bottom: 5px; }
        .score-board { font-size: 1.2rem; font-weight: bold; color: #2e7d32; margin-bottom: 10px; }
        .target-box {
            background: #e3f2fd; border: 2px dashed #1c66ed;
            border-radius: 18px; padding: 18px; margin: 15px 0;
            font-size: 1.1rem; color: #1a4fcc; font-weight: bold; text-align: left; line-height: 1.4;
        }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .option-btn {
            background: #fffdf6; border: 3px solid #ffd54f; border-radius: 18px;
            padding: 15px; font-size: 1rem; cursor: pointer; text-align: left;
            transition: all 0.2s; font-family: inherit; font-weight: bold; color: #333; line-height: 1.3;
        }
        .option-btn:hover { background: #fff8e1; border-color: #ffb300; transform: scale(1.01); }
        .feedback {
            font-size: 1.1rem; font-weight: bold; margin-top: 15px; min-height: 40px;
            padding: 12px; border-radius: 12px; display: none; line-height: 1.3;
        }
        .btn-action {
            background: #27ae60; color: white; border: none; padding: 12px 25px;
            border-radius: 20px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 0 #1e8449; margin-top: 10px; display: none; margin-right: 10px;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: 0 0 0; }
        .btn-home {
            background: #ff5252; color: white; border: none; padding: 12px 25px;
            border-radius: 20px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 0 #d32f2f; margin-top: 10px;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: 0 0 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✍️ Prompt Laboratuvarı</h1>
        <p>Yapay zekaya ne istediğini en **NET**, **DETAYLI** ve **SINIRLARI BELİRLİ** anlatan prompt'u seç!</p>
        
        <div class="score-board">Soru: <span id="q-num">1</span>/5 | Puan: <span id="score">0</span></div>

        <div class="target-box" id="target-desc">Yükleniyor...</div>

        <div class="options-list" id="options-container"></div>

        <div class="feedback" id="feedback"></div>

        <div style="display:flex; justify-content:center; align-items:center;">
            <button class="btn-action" id="next-btn" onclick="nextQuestion()">Sonraki Soru ▶</button>
            <button class="btn-home" onclick="window.history.back()">◀ Ana Menüye Dön</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                target: "🎯 **Görsel Üretimi:** Kırmızı pelerinli, uzayda gezegenler arasında uçan neşeli bir süper kahraman robot çizimi elde etmek istiyoruz.",
                options: [
                    { text: "Bana bir robot resmi çiz.", correct: false, reason: "❌ Çok genel! Pelerin, uzay teması ve neşeli ifadesi eksik." },
                    { text: "Uzayda gezegenlerin arasında uçan, kırmızı pelerin giymiş, neşeyle gülen sevimli bir süper kahraman robot çiz.", correct: true, reason: "🎉 Harika! Mekan, kostüm, eylem ve duygu ifadesi eksiksiz verilmiş." },
                    { text: "Kırmızı renkli uçan bir şeyler çiz.", correct: false, reason: "❌ Belirsiz! Yapay zeka bunun bir robot mu yoksa kuş mu olduğunu anlayamaz." }
                ]
            },
            {
                target: "🎯 **Metin & Hikaye:** İlkokul öğrencileri için Sparky adındaki robotun geri dönüşümü öğrettiği 3 cümlelik kısa bir hikaye yazdırmak istiyoruz.",
                options: [
                    { text: "Geri dönüşüm hakkında uzun bir bilimsel makale yaz.", correct: false, reason: "❌ Makale formatı ilkokul seviyesi için uygun ve eğlenceli değildir." },
                    { text: "7 yaşındaki çocuklar için Sparky adında sevimli bir robotun atıkları ayrıştırdığı 3 cümlelik eğlenceli bir hikaye yaz.", correct: true, reason: "🎉 Mükemmel! Yaş grubu, karakter ismi, konu ve cümle kısıtlaması tam ayarlanmış." },
                    { text: "Sparky adında bir robot hikayesi yaz.", correct: false, reason: "❌ Hikayenin konusu geri dönüşüm olarak belirtilmemiş ve uzunluk sınırı yok." }
                ]
            },
            {
                target: "🎯 **Oyun & Kodlama:** Python dilinde Pygame kütüphanesi kullanarak ekranın ortasında sağa-sola hareket eden yeşil bir kare kodlatmak istiyoruz.",
                options: [
                    { text: "Bana bir Python oyunu yaz.", correct: false, reason: "❌ Hangi kütüphane kullanılacak ve nesne ne yapacak belirtilmemiş." },
                    { text: "Python ve Pygame kullanarak ekranın ortasında klavye ok tuşlarıyla sağa ve sola hareket eden yeşil bir kare kodu yaz.", correct: true, reason: "🎉 Süper! Dil, kütüphane, renk, konum ve kontrol mekanizması eksiksiz." },
                    { text: "Ekranı yeşil yapıp kareler çizdir.", correct: false, reason: "❌ Hareket mantığı ve programlama dili söylenmemiş." }
                ]
            },
            {
                target: "🎯 **3D Tasarım & Model:** 3D yazıcıda basmak üzere içi boş, üstünde yıldız desenleri olan silindir şeklinde bir kalemlik tasarımı tarif etmek istiyoruz.",
                options: [
                    { text: "3D yazıcı için kalemlik modeli yap.", correct: false, reason: "❌ Şekil, desen ve içi boş olması gerektiği söylenmemiş." },
                    { text: "3D baskıya uygun, silindir formunda, dış yüzeyinde kabartmalı yıldız desenleri bulunan içi boş bir masaüstü kalemliği tasarla.", correct: true, reason: "🎉 Muhteşem! Geometrik şekil, yüzey detayı ve kullanım amacı net." },
                    { text: "Plastikten yıldızlı bir şeyler üret.", correct: false, reason: "❌ Kalemlik olduğu ve 3D modelleme detayları eksik." }
                ]
            },
            {
                target: "🎯 **Rol Yapma (Role-Play):** Yapay zekanın uzay konusunda uzman bir astronot gibi davranmasını ve sorularımızı o rolle yanıtlamasını istiyoruz.",
                options: [
                    { text: "Uzay hakkında ne biliyorsun?", correct: false, reason: "❌ Yapay zekaya bir rol veya kişilik atanmamış." },
                    { text: "Sen Uluslararası Uzay İstasyonu'nda görev yapan tecrübeli bir astronotsun. Bana uzayda yaşamanın nasıl bir duygu olduğunu bir astronot gözüyle anlat.", correct: true, reason: "🎉 Harika bir Role-Play prompt'u! Yapay zekanın hangi kimliğe bürüneceği çok açık." },
                    { text: "Astronotlar ne iş yapar listeleyin.", correct: false, reason: "❌ Bilgi listeler ama karakter rolüne girmez." }
                ]
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = questions[currentQ];
            document.getElementById('q-num').innerText = currentQ + 1;
            document.getElementById('target-desc').innerHTML = q.target;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const fb = document.getElementById('feedback');
            fb.style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(opt, btnEl) {
            if (answered) return;
            answered = true;

            const fb = document.getElementById('feedback');
            fb.style.display = 'block';
            fb.innerText = opt.reason;

            if (opt.correct) {
                fb.style.background = '#e8f5e9';
                fb.style.color = '#2e7d32';
                fb.style.border = '2px solid #a5d6a7';
                score += 20;
                document.getElementById('score').innerText = score;
            } else {
                fb.style.background = '#ffebee';
                fb.style.color = '#c62828';
                fb.style.border = '2px solid #ef9a9a';
            }

            if (currentQ < questions.length - 1) {
                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                fb.innerText += " 🏆 TEBRİKLER! Tüm soruları tamamladın!";
                setTimeout(saveBadge, 1200);
            }
        }

        function nextQuestion() {
            if (currentQ < questions.length - 1) {
                currentQ++;
                loadQuestion();
            }
        }

        function saveBadge() {
            const name = prompt("🎉 Tebrikler! 'Prompt Ustası' Rozeti Kazandın!\nBaşarı Panosunda görünmesi için Adını ve Soyadını yaz:");
            if (name && name.trim() !== "") {
                let winners = JSON.parse(localStorage.getItem('prompt_lab_winners')) || [];
                winners.push({ name: name.trim() });
                localStorage.setItem('prompt_lab_winners', JSON.stringify(winners));
                alert("Harika! İsmin Başarı Panosuna eklendi! 🏆");
            }
        }

        loadQuestion();
    </script>
</body>
</html>
