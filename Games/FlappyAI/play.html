<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Flappy Bird - inomaker</title>

    <!-- MediaPipe Face Mesh & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 15px;
            background-color: #26c6da;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; touch-action: manipulation;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 900px; margin-bottom: 12px;
        }

        .btn-back {
            background-color: #ff5252; color: white; border: none;
            border-radius: 20px; padding: 10px 20px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #d32f2f; transition: all 0.1s;
        }
        .btn-back:active { transform: translateY(4px); box-shadow: 0 0 0 #d32f2f; }

        .scoreboard {
            background: #ffffff; padding: 8px 20px; border-radius: 20px;
            font-size: 1.3rem; font-weight: bold; color: #2b2b2b;
            box-shadow: 0 4px 0 #1b8a97; display: flex; gap: 15px; align-items: center;
        }
        .score-val { color: #ff9800; font-size: 1.6rem; }
        .high-val { color: #4caf50; }

        .game-wrapper {
            display: flex; gap: 15px; width: 100%; max-width: 900px;
            justify-content: center; align-items: flex-start;
        }

        .canvas-container {
            position: relative; width: 600px; height: 450px;
            background: #70c5ce; border-radius: 25px; overflow: hidden;
            border: 6px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #gameCanvas {
            width: 100%; height: 100%; display: block;
        }

        .cam-preview {
            width: 220px; height: 165px; background: #000;
            border-radius: 20px; overflow: hidden; border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); position: relative;
        }

        #webcam, #camCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: scaleX(-1); object-fit: cover;
        }

        .instructions {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.65); color: #fff; padding: 8px 18px;
            border-radius: 20px; font-size: 0.95rem; text-align: center;
            z-index: 5; pointer-events: none;
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            z-index: 10; backdrop-filter: blur(4px);
        }

        .btn-start {
            background-color: #4caf50; color: white; border: none; border-radius: 30px;
            padding: 14px 40px; font-size: 1.6rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 0 #2e7d32; transition: all 0.1s; margin-top: 15px;
        }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 0 0 #2e7d32; }

        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 82, 82, 0.95); color: white; padding: 20px; border-radius: 15px;
            z-index: 50; width: 80%; font-size: 1.1rem; text-align: center;
        }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column-reverse; align-items: center; }
            .canvas-container { width: 100%; max-width: 500px; height: 380px; }
            .cam-preview { width: 160px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-back" onclick="location.href='../../index.html#levels'">◀ Menü</button>
        <div class="scoreboard">
            <span>Skor: <span class="score-val" id="scoreDisplay">0</span></span>
            <span>|</span>
            <span>En Yüksek: <span class="high-val" id="highDisplay">0</span></span>
        </div>
    </div>

    <div id="error-msg"></div>

    <div class="game-wrapper">
        <!-- Kamera Önizleme Kutusu -->
        <div class="cam-preview">
            <video id="webcam" playsinline webkit-playsinline></video>
            <canvas id="camCanvas"></canvas>
        </div>

        <!-- Ana Oyun Alanı -->
        <div class="canvas-container">
            <div class="instructions" id="instructionBox">
                Kafanı YUKARI kaldır ⬆️ | Kafanı AŞAĞI eğ ⬇️
            </div>
            <canvas id="gameCanvas" width="600" height="450"></canvas>

            <div class="overlay-screen" id="startScreen">
                <h1 style="margin: 0 0 10px 0; font-size: 2.2rem; text-align: center;">🐦 Flappy AI</h1>
                <p style="font-size: 1.1rem; margin: 0 0 15px 0; text-align: center; width: 80%;">
                    Kafanı yukarı-aşağı hareket ettirerek kuşu engellerin arasından geçir!
                </p>
                <button class="btn-start" id="startBtn" onclick="startGame()" disabled>Kamera Bekleniyor...</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const camCanvas = document.getElementById('camCanvas');
        const camCtx = camCanvas.getContext('2d');
        
        const gameCanvas = document.getElementById('gameCanvas');
        const ctx = gameCanvas.getContext('2d');
        
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highDisplay = document.getElementById('highDisplay');
        const errorMsg = document.getElementById('error-msg');

        // Oyun Değişkenleri
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('flappy_ai_high') || 0;
        highDisplay.innerText = highScore;

        // Kuş Nesnesi
        const bird = {
            x: 100,
            y: 225,
            targetY: 225,
            radius: 18,
            color: '#ffeb3b'
        };

        // Engeller
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 150;
        let pipeTimer = 0;

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
        }

        // --- Oyun Döngüsü ---
        function updateGame() {
            if (gameState !== 'PLAYING') return;

            // Kuşu hedef pozisyona yumuşakça kaydır (Lerp)
            bird.y += (bird.targetY - bird.y) * 0.15;

            // Ekran sınırları
            if (bird.y - bird.radius < 0) bird.y = bird.radius;
            if (bird.y + bird.radius > gameCanvas.height) {
                gameOver();
            }

            // Engelleri Üret
            pipeTimer++;
            if (pipeTimer % 100 === 0) {
                const minHeight = 50;
                const maxHeight = gameCanvas.height - pipeGap - minHeight;
                const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                pipes.push({
                    x: gameCanvas.width,
                    top: topHeight,
                    bottom: gameCanvas.height - topHeight - pipeGap,
                    passed: false
                });
            }

            // Engelleri Hareket Ettir ve Çarpışma Kontrolü
            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= 3; // Boru hızı

                // Çarpışma Kontrolü
                if (
                    bird.x + bird.radius > p.x &&
                    bird.x - bird.radius < p.x + pipeWidth &&
                    (bird.y - bird.radius < p.top || bird.y + bird.radius > gameCanvas.height - p.bottom)
                ) {
                    gameOver();
                }

                // Skor Kazanma
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                    scoreDisplay.innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        highDisplay.innerText = highScore;
                        localStorage.setItem('flappy_ai_high', highScore);
                    }
                }

                // Ekrandan çıkan boruları sil
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawGame() {
            // Arka Plan Gökyüzü
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Bulutlar (Görsel Zenginlik)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(150, 80, 30, 0, Math.PI * 2);
            ctx.arc(180, 70, 40, 0, Math.PI * 2);
            ctx.arc(210, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            // Engelleri Çiz
            pipes.forEach(p => {
                ctx.fillStyle = '#75b855';
                ctx.strokeStyle = '#53823c';
                ctx.lineWidth = 4;

                // Üst Boru
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.strokeRect(p.x, 0, pipeWidth, p.top);

                // Alt Boru
                ctx.fillRect(p.x, gameCanvas.height - p.bottom, pipeWidth, p.bottom);
                ctx.strokeRect(p.x, gameCanvas.height - p.bottom, pipeWidth, p.bottom);
            });

            // Kuşu Çiz
            ctx.save();
            ctx.translate(bird.x, bird.y);

            // Kuş Gövdesi
            ctx.fillStyle = bird.color;
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#d7ccc8';
            ctx.stroke();

            // Göz
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(6, -6, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(8, -6, 3, 0, Math.PI * 2);
            ctx.fill();

            // Gaga
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(12, 2);
            ctx.lineTo(24, 6);
            ctx.lineTo(12, 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            scoreDisplay.innerText = '0';
            pipes = [];
            pipeTimer = 0;
            bird.y = gameCanvas.height / 2;
            gameState = 'PLAYING';
            startScreen.style.display = 'none';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            startScreen.style.display = 'flex';
            startScreen.querySelector('h1').innerText = "Oyun Bitti! 💥";
            startScreen.querySelector('p').innerText = `Skorun: ${score}`;
            startBtn.innerText = "Yeniden Başlat 🔄";
        }

        // --- MediaPipe Face Mesh Takibi ---
        function onResults(results) {
            camCtx.save();
            camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
            camCanvas.width = videoElement.videoWidth || 320;
            camCanvas.height = videoElement.videoHeight || 240;
            camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Burun ucu noktası (Landmark 1)
                const nose = landmarks[1];

                // Burun noktasını ekranda göster
                const nx = nose.x * camCanvas.width;
                const ny = nose.y * camCanvas.height;
                camCtx.beginPath();
                camCtx.arc(nx, ny, 6, 0, 2 * Math.PI);
                camCtx.fillStyle = '#ff5252';
                camCtx.fill();

                // Y koordinatını (0 - 1 arası) Canvas yüksekliğine haritala
                // 0.2 (yukarı) ile 0.7 (aşağı) aralığını hassas kontrol için ölçeklendiriyoruz
                let clampedY = Math.max(0.2, Math.min(0.7, nose.y));
                let normalizedY = (clampedY - 0.2) / (0.7 - 0.2);

                bird.targetY = normalizedY * gameCanvas.height;

                if (startBtn.disabled) {
                    startBtn.disabled = false;
                    startBtn.innerText = "Oyuna Başla! 🚀";
                }
            }
            camCtx.restore();
        }

        try {
            const faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });

            camera.start().catch(() => {
                showError("⚠️ Kamera başlatılamadı!<br>Lütfen tarayıcı izinlerini kontrol edin.");
            });
        } catch (e) {
            showError("⚠️ Yapay zeka modülü yüklenemedi!");
        }

        // Oyun Döngüsünü Başlat
        gameLoop();
    </script>
</body>
</html>
