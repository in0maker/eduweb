<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sihirli Çizim - inomaker</title>
    
    <!-- MediaPipe ve CameraUtils Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #EEC21A;
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; box-sizing: border-box; touch-action: manipulation;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 800px; margin-bottom: 15px;
        }

        .tools-bar {
            display: flex; gap: 10px; background: #ffffff; padding: 8px 15px;
            border-radius: 25px; box-shadow: 0 6px 0 #cccccc; align-items: center;
        }

        .color-btn {
            width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff;
            cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .color-btn.active { transform: scale(1.2); border-color: #333; }

        .btn-clear {
            background-color: #ff9800; color: white; border: none;
            border-radius: 15px; padding: 6px 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #e65100;
        }
        .btn-clear:active { transform: translateY(4px); box-shadow: 0 0 0 #e65100; }

        .btn-back {
            background-color: #ff5252; color: white; border: none;
            border-radius: 20px; padding: 12px 25px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #d32f2f; transition: all 0.1s;
        }
        .btn-back:active { transform: translateY(5px); box-shadow: 0 0 0 #d32f2f; }

        .game-container {
            position: relative; width: 100%; max-width: 800px;
            aspect-ratio: 4 / 3; background: #000; border-radius: 35px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 6px solid #ffffff;
        }

        #webcam, #output_canvas, #draw_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: scaleX(-1); object-fit: cover;
        }

        #draw_canvas { z-index: 5; }

        .instruction-box {
            margin-top: 15px; background: #fffdf6; padding: 15px 30px;
            border-radius: 25px; font-size: 1.2rem; font-weight: bold;
            color: #2b2b2b; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #error-msg {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(255, 82, 82, 0.95);
            color: white; padding: 20px; border-radius: 15px; text-align: center;
            z-index: 20; width: 80%; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .tools-bar { padding: 5px 10px; gap: 5px; }
            .color-btn { width: 24px; height: 24px; }
            .btn-back { font-size: 1rem; padding: 8px 16px; }
            .instruction-box { font-size: 1rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-back" onclick="location.href='../../index.html#levels'">◀ Menü</button>
        <div class="tools-bar">
            <div class="color-btn active" style="background:#ff5252;" onclick="setColor('#ff5252', this)"></div>
            <div class="color-btn" style="background:#4caf50;" onclick="setColor('#4caf50', this)"></div>
            <div class="color-btn" style="background:#2196f3;" onclick="setColor('#2196f3', this)"></div>
            <div class="color-btn" style="background:#ffee55;" onclick="setColor('#ffee55', this)"></div>
            <button class="btn-clear" onclick="clearCanvas()">🗑️ Temizle</button>
        </div>
    </div>

    <div class="game-container">
        <div id="error-msg"></div>
        <video id="webcam" playsinline webkit-playsinline></video>
        <canvas id="output_canvas"></canvas>
        <canvas id="draw_canvas"></canvas>
    </div>

    <div class="instruction-box" id="status-text">
        ☝️ İşaret parmağını kaldırarak havaya çizim yap! (İki parmak: Çizimi Durdur)
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawCanvas = document.getElementById('draw_canvas');
        const drawCtx = drawCanvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');

        let currentColor = '#ff5252';
        let lastX = 0;
        let lastY = 0;
        let isDrawing = false;

        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = msg;
        }

        function setColor(color, el) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function clearCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        function onResults(results) {
            if (!results.image) return;

            const w = videoElement.videoWidth || 640;
            const h = videoElement.videoHeight || 480;

            canvasElement.width = w;
            canvasElement.height = h;
            if (drawCanvas.width !== w || drawCanvas.height !== h) {
                drawCanvas.width = w;
                drawCanvas.height = h;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const indexTip = landmarks[8];
                const middleTip = landmarks[12];

                const ix = indexTip.x * w;
                const iy = indexTip.y * h;
                const mx = middleTip.x * w;
                const my = middleTip.y * h;

                // İki parmak arası mesafe kontrolü (İşaret + Orta parmak yakında ise çizme)
                const distance = Math.hypot(ix - mx, iy - my);

                if (distance > 50) { // Sadece İşaret parmağı kalkık -> Çiz
                    canvasCtx.beginPath();
                    canvasCtx.arc(ix, iy, 12, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = currentColor;
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = '#ffffff';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.stroke();

                    if (isDrawing) {
                        drawCtx.beginPath();
                        drawCtx.moveTo(lastX, lastY);
                        drawCtx.lineTo(ix, iy);
                        drawCtx.strokeStyle = currentColor;
                        drawCtx.lineWidth = 8;
                        drawCtx.lineCap = 'round';
                        drawCtx.stroke();
                    }
                    lastX = ix;
                    lastY = iy;
                    isDrawing = true;
                } else {
                    // Çizim durduruldu (İki parmak açık)
                    isDrawing = false;
                    canvasCtx.beginPath();
                    canvasCtx.arc(ix, iy, 20, 0, 2 * Math.PI);
                    canvasCtx.strokeStyle = '#ffee55';
                    canvasCtx.lineWidth = 4;
                    canvasCtx.stroke();
                }
            } else {
                isDrawing = false;
            }
            canvasCtx.restore();
        }

        try {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().catch(() => {
                showError("⚠️ Kamera başlatılamadı!<br>Lütfen tarayıcınızın kamera iznini kontrol edin.");
            });
        } catch (e) {
            showError("⚠️ Kütüphaneler yüklenirken hata oluştu!<br>İnternet bağlantınızı kontrol edin.");
        }
    </script>
</body>
</html>
